[build-system]
requires = ["setuptools>=64", "wheel", "grpcio-tools>=1.50.0"]
build-backen = "setuptools.build-meta"

[project]
name = "guru"
version = "1.0.0"
description = "A library to help develop glue apps for the ElkAudio Stomp platform"
authors = [{name = "Maxime Gendebien", email = "max@elk.audio"}]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
      "Development Status :: 3 - Alpha",
      "Intended Audience :: Developers",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Programming Language :: Python :: 3.13",
  ]

dependencies = ["elkpy==2.0.0rc5", "grpcio>=1.50.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-asyncio>=0.21.0", "grpcio-tools>=1.50.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["guru"]

[tool.setuptools.package-data]
guru = ["*.py", "*.pyi"]
